<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>移动端预览 · datou.fm</title>
<style>
  html, body { margin: 0; height: 100%; background: #1a1f26; }
  .wrap {
    min-height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 18px;
    padding: 32px 16px;
    box-sizing: border-box;
    font-family: -apple-system, system-ui, sans-serif;
  }
  .label { color: #8b95a3; font-size: 13px; letter-spacing: 0.06em; }
  .phone {
    width: 390px;
    height: 780px;
    border: 12px solid #0c0f13;
    border-radius: 44px;
    overflow: hidden;
    box-shadow: 0 30px 70px -20px rgba(0,0,0,0.7);
    background: #f3ece0;
  }
  .phone iframe { width: 390px; height: 100%; border: 0; display: block; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="label">iPhone 宽度预览 · 390px</div>
    <div class="phone">
      <iframe id="previewFrame" src="index.html" title="datou.fm 移动端预览"></iframe>
    </div>
  </div>
</body>
</html>
