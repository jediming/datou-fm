<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate" />
<meta http-equiv="Pragma" content="no-cache" />
<meta http-equiv="Expires" content="0" />
<title>活动 · 大头会 · datou.fm</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<link rel="icon" href="assets/mark.svg">
<link rel="apple-touch-icon" href="assets/apple-touch-icon.png">
<style>
  :root {
    --oxford: #002147;
    --cream: #e8d9b8;
    --bone: #f3ece0;
    --brass: #b08856;
    --ink: #002147;
    --rule: rgba(0, 33, 71, 0.15);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  html {
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    scroll-behavior: smooth;
  }
  body {
    background: var(--bone);
    color: var(--ink);
    font-family: 'Noto Serif SC', 'Songti SC', 'STSong', serif;
    font-size: 17px;
    line-height: 1.75;
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    overflow-x: hidden;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
  }
  a { color: var(--oxford); text-decoration: underline; text-underline-offset: 3px; text-decoration-thickness: 1px; transition: color .2s; }
  a:hover { color: var(--brass); }

  /* ── header ───────────────────────────────────────── */
  header.site {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 28px 48px 0;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    row-gap: 12px;
  }
  .brand { display: inline-flex; align-items: baseline; gap: 16px; text-decoration: none; }
  .brand .hanzi {
    font-family: 'Noto Serif SC', serif;
    font-weight: 600;
    font-size: 24px;
    letter-spacing: 0.18em;
    color: var(--oxford);
  }
  .brand .divider { display: inline-block; width: 1px; height: 18px; background: var(--brass); opacity: 0.5; align-self: center; }
  .brand .latin {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: 22px;
    letter-spacing: 0.06em;
    color: var(--brass);
  }
  nav.top { display: flex; gap: 28px; }
  nav.top a {
    text-decoration: none;
    font-size: 15px;
    color: var(--oxford);
    letter-spacing: 0.05em;
    padding: 10px 0;
    -webkit-tap-highlight-color: transparent;
    transition: color .15s ease;
  }
  nav.top a:hover { color: var(--brass); }
  nav.top a.is-current { color: var(--brass); }

  /* ── event hero ──────────────────────────────────── */
  main.event {
    flex: 1 1 auto;
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 56px 48px 80px;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .invite {
    position: relative;
    width: 100%;
    max-width: 720px;
    background: var(--oxford);
    color: var(--cream);
    text-align: center;
    padding: clamp(56px, 9vw, 104px) clamp(28px, 7vw, 88px);
    overflow: hidden;
  }
  .invite::after {
    content: "";
    position: absolute;
    inset: 18px;
    border: 1px solid rgba(232, 217, 184, 0.28);
    pointer-events: none;
  }
  .invite .mark {
    width: 64px;
    height: 38px;
    margin: 0 auto 26px;
  }
  .invite .mark svg { width: 100%; height: 100%; display: block; }
  .invite .kicker {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: clamp(13px, 1.6vw, 16px);
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: rgba(232, 217, 184, 0.62);
    margin: 0 0 28px;
  }
  .invite .year {
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-weight: 500;
    font-size: clamp(54px, 12vw, 116px);
    line-height: 0.92;
    letter-spacing: 0.01em;
    color: var(--cream);
    margin: 0;
  }
  .invite .title {
    margin: 24px 0 0;
    color: var(--cream);
  }
  .invite .title-sub {
    display: block;
    font-family: 'Noto Serif SC', serif;
    font-weight: 500;
    font-size: clamp(17px, 2.8vw, 24px);
    letter-spacing: 0.3em;
    text-indent: 0.3em;
    color: rgba(232, 217, 184, 0.72);
    margin-bottom: 14px;
  }
  .invite .title-main {
    display: block;
    font-family: 'Noto Serif SC', serif;
    font-weight: 600;
    font-size: clamp(28px, 5.4vw, 50px);
    letter-spacing: 0.24em;
    text-indent: 0.24em;
    color: var(--cream);
  }
  .invite .divider-line {
    width: 56px;
    height: 1px;
    background: var(--brass);
    margin: 32px auto;
    opacity: 0.8;
  }
  .invite .await {
    font-family: 'Noto Serif SC', serif;
    font-weight: 400;
    font-size: clamp(15px, 2.1vw, 19px);
    letter-spacing: 0.42em;
    text-indent: 0.42em;
    color: rgba(232, 217, 184, 0.7);
    margin: 0;
  }

  /* ── footer ──────────────────────────────────────── */
  footer.site {
    width: 100%;
    max-width: 1180px;
    margin: 0 auto;
    padding: 40px 48px 56px;
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    font-family: 'Cormorant Garamond', serif;
    font-style: italic;
    font-size: 14px;
    color: rgba(0, 33, 71, 0.55);
    letter-spacing: 0.08em;
    border-top: 1px solid var(--rule);
  }
  footer.site .right { display: flex; gap: 22px; }
  footer.site a { color: rgba(0, 33, 71, 0.7); text-decoration: none; }
  footer.site a:hover { color: var(--brass); }

  /* ── touch behaviour layer ───────────────────────── */
  nav.top a, .brand {
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }
  nav.top a:active { color: var(--brass); }
  nav.top a:focus-visible, .brand:focus-visible {
    outline: 2px solid var(--brass);
    outline-offset: 3px;
    border-radius: 4px;
  }
  @media (max-width: 880px) {
    header.site { padding: 22px 24px 0; }
    main.event { padding: 40px 24px 64px; }
    nav.top { gap: 18px; }
    nav.top a { font-size: 14px; }
    footer.site { flex-direction: column; gap: 14px; padding: 32px 24px; }
  }
  @media (max-width: 480px) {
    header.site { padding: 18px 18px 0; gap: 8px; }
    main.event { padding: 28px 18px 48px; }
    footer.site { padding: 28px 18px 36px; gap: 12px; }
    footer.site .right { flex-wrap: wrap; gap: 16px; row-gap: 8px; }
    .brand { gap: 12px; }
    .brand .hanzi { font-size: 22px; letter-spacing: 0.16em; }
    .brand .latin { font-size: 18px; }
    .brand .divider { height: 16px; }
    nav.top { width: 100%; justify-content: flex-start; gap: 22px; }
    nav.top a { font-size: 14px; padding: 12px 0; letter-spacing: 0.06em; }
    .invite::after { inset: 12px; }
    .invite .title-main { letter-spacing: 0.16em; text-indent: 0.16em; }
    .invite .title-sub { letter-spacing: 0.22em; text-indent: 0.22em; }
  }
  /* ── mobile bottom tab bar ───────────────────────── */
  .tabbar { display: none; }
  @media (max-width: 480px) {
    nav.top { display: none; }
    .tabbar {
      display: flex;
      position: fixed;
      left: 0; right: 0; bottom: 0;
      z-index: 9998;
      background: var(--bone);
      border-top: 1px solid var(--rule);
      padding: 8px 0 calc(8px + env(safe-area-inset-bottom));
      box-shadow: 0 -8px 22px -16px rgba(0, 33, 71, 0.35);
    }
    .tabbar .tab {
      flex: 1 1 0;
      min-height: 48px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 4px;
      text-decoration: none;
      color: rgba(0, 33, 71, 0.5);
      font-family: 'Noto Serif SC', serif;
      font-size: 12px; font-weight: 500; letter-spacing: 0.14em;
      touch-action: manipulation;
      -webkit-tap-highlight-color: transparent;
      -webkit-user-select: none; user-select: none;
      cursor: pointer;
      transition: color .15s ease;
    }
    .tabbar .tab svg { width: 22px; height: 22px; }
    .tabbar .tab.is-current { color: var(--oxford); }
    .tabbar .tab:active { color: var(--brass); }
    .tabbar .tab:focus-visible { outline: 2px solid var(--brass); outline-offset: -3px; border-radius: 8px; }
    body { padding-bottom: calc(74px + env(safe-area-inset-bottom)); }
  }
</style>
</head>
<body>

<header class="site">
  <a class="brand" href="index.html">
    <span class="hanzi">大头会</span>
    <span class="divider"></span>
    <span class="latin">datou.fm</span>
  </a>
  <nav class="top">
    <a href="index.html#episodes">播客</a>
    <a href="book.html">读书</a>

        <path d="M 30 170 A 110 110 0 0 1 250 170" fill="none" stroke="#e8d9b8" stroke-width="5" stroke-opacity="0.85" />
        <path d="M 70 170 A 70 70 0 0 1 210 170" fill="none" stroke="#e8d9b8" stroke-width="5" stroke-opacity="0.85" />
        <path d="M 105 170 A 35 35 0 0 1 175 170" fill="none" stroke="#e8d9b8" stroke-width="5" stroke-opacity="0.85" />

<footer class="site">

  </div>
</footer>

<nav class="tabbar" aria-label="导航">
  <a class="tab" href="index.html#episodes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2.5" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><line x1="12" y1="17.5" x2="12" y2="21"/></svg>
    <span>播客</span>
  </a>
  <a class="tab" href="book.html">

  </a>

    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><line x1="3.5" y1="9.5" x2="20.5" y2="9.5"/><line x1="8" y1="3" x2="8" y2="6"/><line x1="16" y1="3" x2="16" y2="6"/></svg>

</nav>

</body>
</html>
